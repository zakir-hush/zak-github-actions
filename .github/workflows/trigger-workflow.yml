name: Exploring Variables and Secrets

on:
    schedule:
        - cron: '*/5 * * * *' # Runs every minute


env:
    CONTAINER_REGISTRY: docker.io
    # {{ vars.DOCKER_USERNAME }}: zakirhush
    DOCKER_IMAGE_NAME: github-actions-nginx
    # DOCKER_PASSWORD: s3cUrePassw0rd

jobs:       
    docker:
        runs-on: ubuntu-latest
        steps:
        - name: Docker Build
          run: echo docker build -t $CONTAINER_REGISTRY/${{ vars.DOCKER_USERNAME }}/$DOCKER_IMAGE_NAME:latest  

        - name: Docker Login            
          run: echo docker login --username=${{ vars.DOCKER_USERNAME }} --password=${{ secrets.DOCKER_PASSWORD }}

        - name: Docker Publish
          run: echo docker push $CONTAINER_REGISTRY/${{ vars.DOCKER_USERNAME }}/$DOCKER_IMAGE_NAME:latest

    deploy:
        needs: docker
        runs-on: ubuntu-latest
        steps:
        - name: Docker Run
          run: echo docker run -d -p 8080:80 $CONTAINER_REGISTRY/${{ vars.DOCKER_USERNAME }}/$DOCKER_IMAGE_NAME:latest 









name: Generate ASCII Artwork - multiple jobs

on: push

jobs:
    build_job_1:
        runs-on: ubuntu-latest
        steps:
        # - name: Checkout Repository
        #   uses: actions/checkout@v4

        - name: install cowsay Package
          run: sudo apt-get install -y cowsay
    
        - name: Execute Cowsay Command
          run: cowsay -f turkey "Hello turkey from GitHub Actions!" >> turkey.txt

        - name: sleep for 5 seconds
          run: sleep 5

    test_job_2:
        needs: build_job_1
        runs-on: ubuntu-latest
        steps:
        # - name: Checkout Repository
        #   uses: actions/checkout@v4

        - name: sleep for 10 seconds
          run: sleep 10
    
        - name: Test File Exists
          run: grep -i "turkey" turkey.txt

    deploy_job_3:
        needs: test_job_2
        runs-on: ubuntu-latest
        steps:
        # - name: Checkout Repository
        #   uses: actions/checkout@v4

        - name: Read File
          run: cat turkey.txt

        - name: Deploy File
          run: echo Deploying ... .. .
          
    
   

 

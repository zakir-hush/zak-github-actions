name: Generate ASCII Artwork - multiple jobs

on: push

jobs:
    build_job_1:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: install cowsay Package
          run: sudo apt-get install -y cowsay
    
        - name: Execute Cowsay Command
          run: cowsay -f cow "Hello cow from GitHub Actions!" >> cow.txt

        - name: sleep for 30 seconds
          run: sleep 30

    test_job_2:
        runs-on: ubuntu-latest
        steps:
        # - name: Checkout Repository
        #   uses: actions/checkout@v4

        - name: sleep for 10 seconds
          run: sleep 10
    
        - name: Test File Exists
          run: grep -i "cow" cow.txt

    deploy_job_3:
        runs-on: ubuntu-latest
        steps:
        # - name: Checkout Repository
        #   uses: actions/checkout@v4

        - name: Read File
          run: cat cow.txt

        - name: Deploy File
          run: exho Deploying ... .. .
          
    
   

 
